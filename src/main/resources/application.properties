# ============================================================================
# POETRYVERSE - APPLICATION CONFIGURATION
# ============================================================================
spring.application.name=PoetryVerse
server.port=${PORT:8080}

# ----------------------------------------------------------------------------
# MYSQL DATABASE CONFIGURATION (Primary)
# Override via environment variables MYSQL_URL, MYSQL_USER, MYSQL_PASSWORD
# If MySQL on localhost:3306 is unreachable, SmartDataSourceConfig automatically
# falls back to persistent local MySQL-compatible storage in ./data/poetryverse_db
# ----------------------------------------------------------------------------
poetryverse.db.mysql.url=${MYSQL_URL:jdbc:mysql://localhost:3306/poetryverse_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
poetryverse.db.mysql.username=${MYSQL_USER:root}
poetryverse.db.mysql.password=${MYSQL_PASSWORD:}
poetryverse.db.fallback.url=jdbc:h2:file:./data/poetryverse_db;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;DB_CLOSE_ON_EXIT=FALSE

# ----------------------------------------------------------------------------
# JPA / HIBERNATE ORM
# ----------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.globally_quoted_identifiers=false

# ----------------------------------------------------------------------------
# THYMELEAF TEMPLATES
# ----------------------------------------------------------------------------
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.mode=HTML
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html

# ----------------------------------------------------------------------------
# MULTIPART FILE UPLOADS (Cover Art, Avatars, TXT Imports)
# ----------------------------------------------------------------------------
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=15MB
spring.servlet.multipart.max-request-size=20MB

# ----------------------------------------------------------------------------
# SESSION & SECURITY
# ----------------------------------------------------------------------------
server.servlet.session.timeout=7d
server.servlet.session.cookie.http-only=true
server.error.whitelabel.enabled=false
