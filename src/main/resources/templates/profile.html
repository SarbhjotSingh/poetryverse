<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/layout :: head('Poet Profile &amp; Portfolio')}"></head>
<body th:attr="data-theme=${userSettings != null ? userSettings.themeMode : 'EDITORIAL_OLIVE'}">

<div class="workspace-shell">
    <aside th:replace="~{fragments/layout :: sidebar}"></aside>

    <div class="workspace-main">
        <header th:replace="~{fragments/layout :: topbar('Poet Profile')}"></header>

        <main class="workspace-content">
            <!-- ============================================================
                 1. EDITORIAL PORTFOLIO HEADER (AUBADE OVAL GOLD FRAME STYLE)
                 ============================================================ -->
            <div class="p-4 p-md-5 mb-4 rounded-2 position-relative overflow-hidden shadow-sm"
                 style="background-color: #353626; color: #F5F0E5; border: 2px solid #A18B50;">
                <img th:src="@{/images/botanical-eucalyptus.svg}" alt=""
                     style="position: absolute; top: 0; right: 0; width: 220px; opacity: 0.25; pointer-events: none;"/>

                <div class="row align-items-center g-4 position-relative" style="z-index: 2;">
                    <div class="col-md-3 text-center">
                        <div class="frame-oval-gold mx-auto" style="width: 165px; height: 205px; background: #25251E;">
                            <img id="profileAvatarPreview"
                                 th:src="${currentUser.avatarUrl != null ? currentUser.avatarUrl : '/images/avatar-poet.svg'}"
                                 alt="Poet Portrait"
                                 style="width: 100%; height: 100%; object-fit: cover;"/>
                        </div>
                    </div>

                    <div class="col-md-9">
                        <div class="d-flex flex-wrap justify-content-between align-items-start gap-2">
                            <div>
                                <div class="script-accent" style="font-size: 26px; color: #C8B276;"
                                     th:text="${currentUser.penName}">C. E. Vance</div>
                                <h1 class="serif-heading text-white mb-1" style="font-size: 38px; font-weight: 600;"
                                    th:text="${currentUser.fullName}">Clara Evangeline Vance</h1>
                                <div style="font-size: 13px; color: #D9D0B9;">
                                    <span>@<span th:text="${currentUser.username}">clara_vance</span></span>
                                    <span class="mx-2">•</span>
                                    <span><i class="fa-solid fa-location-dot me-1" style="color: #A18B50;"></i><span th:text="${currentUser.location}">Bath, Somerset</span></span>
                                    <span class="mx-2">•</span>
                                    <span><i class="fa-solid fa-fire-flame-curved me-1" style="color: #C8B276;"></i><span th:text="${currentUser.currentStreak + ' Day Streak'}">9 Day Streak</span></span>
                                </div>
                            </div>

                            <a th:href="@{/settings}" class="btn-editorial btn-editorial-ivory-outline" style="padding: 8px 16px;">
                                <i class="fa-solid fa-sliders"></i> Sanctuary Settings
                            </a>
                        </div>

                        <p class="mt-3 mb-2" style="color: #EAE4D3; font-size: 14.5px; max-width: 680px; line-height: 1.75;"
                           th:text="${currentUser.bio}"></p>

                        <div class="serif-heading fst-italic" style="font-size: 18px; color: #C8B276;"
                             th:text="'“' + ${currentUser.signatureQuote} + '”'"></div>
                    </div>
                </div>
            </div>

            <!-- ============================================================
                 2. EDIT PROFILE FORM & RECENT PORTFOLIO SHOWCASE
                 ============================================================ -->
            <div class="row g-4">
                <!-- Edit Poet Biography & Identity Form -->
                <div class="col-lg-7">
                    <div class="olive-panel-card">
                        <div class="olive-panel-header">
                            <span>Update Poet Biography &amp; Identity</span>
                            <i class="fa-solid fa-user-pen"></i>
                        </div>
                        <div class="olive-panel-body">
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="label-editorial">Full Name</label>
                                    <input type="text" id="profFullName" class="input-editorial" th:value="${currentUser.fullName}"/>
                                </div>
                                <div class="col-md-6">
                                    <label class="label-editorial">Literary Pen Name</label>
                                    <input type="text" id="profPenName" class="input-editorial" th:value="${currentUser.penName}"/>
                                </div>
                                <div class="col-md-6">
                                    <label class="label-editorial">Username</label>
                                    <input type="text" id="profUsername" class="input-editorial" th:value="${currentUser.username}"/>
                                </div>
                                <div class="col-md-6">
                                    <label class="label-editorial">Email Address</label>
                                    <input type="email" id="profEmail" class="input-editorial" th:value="${currentUser.email}"/>
                                </div>
                                <div class="col-md-6">
                                    <label class="label-editorial">Location / Study</label>
                                    <input type="text" id="profLocation" class="input-editorial" th:value="${currentUser.location}"/>
                                </div>
                                <div class="col-md-6">
                                    <label class="label-editorial">Favorite Poets / Influences</label>
                                    <input type="text" id="profFavPoet" class="input-editorial" th:value="${currentUser.favoritePoet}"/>
                                </div>
                                <div class="col-md-12">
                                    <label class="label-editorial">Portrait Image URL (or Select Preset Below)</label>
                                    <div class="d-flex gap-2">
                                        <input type="text" id="profAvatarUrl" class="input-editorial" th:value="${currentUser.avatarUrl}"/>
                                        <button type="button" class="btn-editorial btn-editorial-outline" style="padding: 8px 12px;"
                                                onclick="document.getElementById('profAvatarUrl').value='/images/avatar-poet.svg'">
                                            Default Crest
                                        </button>
                                    </div>
                                </div>
                                <div class="col-md-12">
                                    <label class="label-editorial">Signature Epigraph / Quote</label>
                                    <input type="text" id="profQuote" class="input-editorial" th:value="${currentUser.signatureQuote}"/>
                                </div>
                                <div class="col-md-12">
                                    <label class="label-editorial">Poet Biography</label>
                                    <textarea id="profBio" rows="4" class="input-editorial" th:text="${currentUser.bio}"></textarea>
                                </div>
                            </div>

                            <div class="mt-4 d-flex justify-content-end">
                                <button type="button" onclick="savePoetProfile()" class="btn-editorial btn-editorial-olive">
                                    <i class="fa-solid fa-floppy-disk"></i> Save Profile Changes
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Right Column: Portfolio Summary & Recent Manuscripts -->
                <div class="col-lg-5 d-flex flex-column gap-4">
                    <div class="olive-panel-card">
                        <div class="olive-panel-header">
                            <span>Sanctuary Archive Summary</span>
                            <i class="fa-solid fa-award"></i>
                        </div>
                        <div class="olive-panel-body">
                            <div class="row text-center g-2">
                                <div class="col-4 p-2" style="border-right: 1px solid rgba(96,96,77,0.2);">
                                    <div class="serif-heading" style="font-size: 32px; font-weight: 600;" th:text="${totalPoems}">6</div>
                                    <div style="font-size: 11px; color: var(--text-secondary); text-transform: uppercase;">Poems</div>
                                </div>
                                <div class="col-4 p-2" style="border-right: 1px solid rgba(96,96,77,0.2);">
                                    <div class="serif-heading" style="font-size: 32px; font-weight: 600;" th:text="${totalCollections}">7</div>
                                    <div style="font-size: 11px; color: var(--text-secondary); text-transform: uppercase;">Collections</div>
                                </div>
                                <div class="col-4 p-2">
                                    <div class="serif-heading" style="font-size: 32px; font-weight: 600;" th:text="${totalWords}">482</div>
                                    <div style="font-size: 11px; color: var(--text-secondary); text-transform: uppercase;">Words</div>
                                </div>
                            </div>
                            <hr style="border-color: rgba(96,96,77,0.2);"/>
                            <div class="d-flex justify-content-between align-items-center" style="font-size: 13px;">
                                <span>Personal Archive Backup</span>
                                <a th:href="@{/api/backup/download}" class="btn-editorial btn-editorial-outline" style="padding: 6px 14px;">
                                    <i class="fa-solid fa-download"></i> Download .TXT Archive
                                </a>
                            </div>
                        </div>
                    </div>

                    <!-- Recent Manuscripts List -->
                    <div class="olive-panel-card">
                        <div class="olive-panel-header">
                            <span>Recent Portfolio Works</span>
                            <a th:href="@{/library}" style="color: #F5F0E5; font-size: 12px;">All &rarr;</a>
                        </div>
                        <div class="olive-panel-body">
                            <div class="d-flex flex-column gap-2">
                                <div th:each="p : ${recentPoems}" class="p-2 rounded d-flex justify-content-between align-items-center"
                                     style="background: var(--bg-paper); border: 1px solid rgba(161,139,80,0.25);">
                                    <div>
                                        <div class="serif-heading fw-semibold" style="font-size: 18px; cursor: pointer;"
                                             th:onclick="'PoetryVerse.openManuscriptModal(' + ${p.id} + ')'"
                                             th:text="${p.title}">Title</div>
                                        <div style="font-size: 11.5px; color: var(--text-secondary);"
                                             th:text="${p.genre + ' • ' + p.wordCount + ' words'}"></div>
                                    </div>
                                    <a th:href="@{'/editor/' + ${p.id}}" class="btn btn-sm">
                                        <i class="fa-solid fa-pen-nib" style="color: #A18B50;"></i>
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
</div>

<div th:replace="~{fragments/layout :: modalsAndScripts}"></div>
<script>
    async function savePoetProfile() {
        const payload = {
            fullName: document.getElementById('profFullName').value,
            penName: document.getElementById('profPenName').value,
            username: document.getElementById('profUsername').value,
            email: document.getElementById('profEmail').value,
            location: document.getElementById('profLocation').value,
            favoritePoet: document.getElementById('profFavPoet').value,
            avatarUrl: document.getElementById('profAvatarUrl').value,
            signatureQuote: document.getElementById('profQuote').value,
            bio: document.getElementById('profBio').value
        };

        const res = await fetch('/api/profile/update', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (data.success) {
            PoetryVerse.showToast(data.message);
            setTimeout(() => window.location.reload(), 650);
        } else {
            PoetryVerse.showToast(data.message || 'Could not update profile.', 'error');
        }
    }
</script>
</body>
</html>
