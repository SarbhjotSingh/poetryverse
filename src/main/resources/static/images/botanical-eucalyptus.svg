    <ellipse cx="222" cy="78" rx="25" ry="10" transform="rotate(-42 222 78)" fill="#859972" opacity="0.7"/>
    <ellipse cx="192" cy="112" rx="26" ry="10" transform="rotate(-38 192 112)" fill="#586B48" opacity="0.8"/>
